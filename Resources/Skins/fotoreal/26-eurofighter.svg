    .flame { transform-box: fill-box; transform-origin: right center; animation: flick .14s ease-in-out infinite alternate; animation-delay: -.03s; }
    @keyframes flick { from{transform:scaleX(1)} to{transform:scaleX(1.45)} }
    .trail { stroke-dasharray: 46 220; animation: trailDash 1s linear infinite; animation-delay: -.02s; }
    .trail.d2 { animation-delay: -.12s; }
    @keyframes trailDash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -266; } }
  </style>
