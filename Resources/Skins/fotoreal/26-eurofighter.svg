<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -7 312 83">
  <defs>
    <linearGradient id="f26body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccd4dc"/><stop offset=".3" stop-color="#a6b0b9"/>
      <stop offset=".68" stop-color="#8a959f"/><stop offset="1" stop-color="#67727c"/>
    </linearGradient>
    <filter id="f26blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="f26noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".95" numOctaves="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .75  0 0 0 0 .78  0 0 0 0 .82  0 0 0 .12 0"/>
