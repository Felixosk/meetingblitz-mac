        <circle cx="142" cy="37" r="1.2"/><circle cx="156" cy="38" r="1.2"/><circle cx="170" cy="40" r="1.2"/>
        <circle cx="58" cy="74" r="1.2"/><circle cx="72" cy="77" r="1.2"/><circle cx="86" cy="80" r="1.2"/>
        <circle cx="100" cy="82" r="1.2"/><circle cx="114" cy="83" r="1.2"/><circle cx="128" cy="83" r="1.2"/>
        <circle cx="142" cy="83" r="1.2"/><circle cx="156" cy="82" r="1.2"/><circle cx="170" cy="80" r="1.2"/>
      </g>
