    <g class="pw d2"><circle cx="28" cy="68" r="2.6" fill="#bfe8f5" opacity=".4"/></g>
    <g class="prop"><ellipse cx="24" cy="62" rx="6" ry="14" fill="#4a3d31" opacity=".9"/></g>
    <path d="M28 54 L44 46 L44 78 L28 70 Z" fill="#2b2118"/>
    <path d="M62 34 Q94 24 134 24 L174 26 Q192 28 204 34 L62 40 Z" fill="#4a3d31"/>
    <path d="M36 60 Q44 32 114 30 Q186 28 228 48 L252 60 L228 72 Q186 92 114 90 Q44 88 36 60 Z" fill="url(#n5f-hull)"/>
    <g clip-path="url(#n5f-clip)">
      <path d="M36 60 Q44 32 114 30 Q186 28 228 48 L252 60 L228 72 Q186 92 114 90 Q44 88 36 60 Z" fill="#fff" filter="url(#n5f-noise)" opacity=".45"/>
      <path d="M46 46 Q114 33 206 42" stroke="#c9ad8a" stroke-width="1.4" fill="none" opacity=".45"/>
    </g>
    <circle cx="196" cy="60" r="14" fill="#16262d"/>
    <circle cx="196" cy="60" r="14" fill="none" stroke="#6e5d50" stroke-width="3.5"/>
    <circle cx="196" cy="60" r="9" fill="none" stroke="#4a3d31" stroke-width="1.5"/>
    <circle cx="192" cy="55" r="3.5" fill="#d9a74a" opacity=".5" filter="url(#n5f-blur)"/>
    <circle cx="124" cy="60" r="7" fill="#16262d" stroke="#6e5d50" stroke-width="2.5"/>
    <circle cx="84" cy="60" r="6" fill="#16262d" stroke="#6e5d50" stroke-width="2.5"/>
    <g clip-path="url(#n5f-clip)">
