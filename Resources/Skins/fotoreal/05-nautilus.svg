<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 281 126">
  <style>
    .bob { transform-box: fill-box; transform-origin: 50% 50%; animation: bob 3.1s ease-in-out infinite alternate; animation-delay: -2.4s; }
    @keyframes bob { from { transform: translateY(-4px) rotate(-1.5deg); } to { transform: translateY(4px) rotate(1.5deg); } }
    .prop { transform-box: fill-box; transform-origin: center; animation: propSide .5s linear infinite; animation-delay: -.12s; }
    @keyframes propSide { 0% { transform: scaleY(1); } 50% { transform: scaleY(.15); } 100% { transform: scaleY(1); } }
    .pw { transform-box: fill-box; animation: propwash 1.7s linear infinite; }
    .pw.d2 { animation-delay: -1.25s; }
    @keyframes propwash { 0% { transform: translate(0,0) scale(.5); opacity: .55; } 100% { transform: translate(-40px,-12px) scale(1.4); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="n5f-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a796a"/><stop offset=".2" stop-color="#5d4e42"/>
      <stop offset=".55" stop-color="#3a2f26"/><stop offset=".88" stop-color="#191410"/>
      <stop offset="1" stop-color="#2e261e"/>
    </linearGradient>
    <filter id="n5f-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="n5f-noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .6  0 0 0 0 .5  0 0 0 0 .38  0 0 0 .32 0"/>
      <feComposite operator="in" in2="SourceAlpha"/>
    </filter>
    <clipPath id="n5f-clip">
      <path d="M36 60 Q44 32 114 30 Q186 28 228 48 L252 60 L228 72 Q186 92 114 90 Q44 88 36 60 Z"/>
    </clipPath>
  </defs>
  <g class="bob">
