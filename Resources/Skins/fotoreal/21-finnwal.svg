      82% { transform: scaleY(1.06); opacity: .55; }
      100% { transform: scaleY(.2); opacity: 0; }
    }
    .tail { transform-box: fill-box; transform-origin: right center; animation: flap 0.9s ease-in-out infinite alternate; animation-delay: -.65s; }
