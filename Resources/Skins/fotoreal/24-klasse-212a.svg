    @keyframes bob { from { transform: translateY(-4px) rotate(-1.6deg);} to { transform: translateY(4px) rotate(1.6deg);} }
    .prop { transform-box: fill-box; transform-origin: center; animation: propSide .5s linear infinite; animation-delay: -.05s; }
    @keyframes propSide { 0%{transform:scaleY(1)} 50%{transform:scaleY(.15)} 100%{transform:scaleY(1)} }
    .pw { transform-box: fill-box; animation: propwash 1.7s linear infinite; animation-delay: -.9s; }
    .pw.d2 { animation-delay: -1.45s; }
    @keyframes propwash { 0% { transform: translate(0,0) scale(.5); opacity:.55; } 100% { transform: translate(-40px,-12px) scale(1.4); opacity:0; } }
  </style>
