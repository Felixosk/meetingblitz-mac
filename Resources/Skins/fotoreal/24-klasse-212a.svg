<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -13 268 112">
  <defs>
    <linearGradient id="f24hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a626c"/><stop offset=".22" stop-color="#31383f"/>
      <stop offset=".55" stop-color="#161b21"/><stop offset=".88" stop-color="#06080b"/>
      <stop offset="1" stop-color="#141a20"/>
    </linearGradient>
    <filter id="f24blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="f24noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .42  0 0 0 0 .47  0 0 0 0 .52  0 0 0 .24 0"/>
