<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -110 320 230">
  <defs>
    <linearGradient id="o22fG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6873"/><stop offset=".2" stop-color="#39434d"/>
      <stop offset=".5" stop-color="#1c242c"/><stop offset=".88" stop-color="#080b0f"/>
      <stop offset="1" stop-color="#1a222a"/>
    </linearGradient>
    <filter id="o22fb" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="o22fn" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .55  0 0 0 0 .6  0 0 0 .26 0"/>
      <feComposite operator="in" in2="SourceAlpha"/>
    </filter>
    <clipPath id="o22fHull">
      <path d="M44 87 Q60 66 144 64 L252 64 Q294 68 306 87 Q294 104 250 108 L130 108 Q62 106 44 87 Z"/>
    </clipPath>
  </defs>
  <style>
    .o22-bob { transform-box: fill-box; transform-origin: center; animation: o22bob 3.1s ease-in-out infinite alternate; animation-delay: -2.1s; }
    @keyframes o22bob { from{ transform: translateY(-3px) rotate(-1deg); } to{ transform: translateY(3px) rotate(1deg); } }
    .prop { transform-box: fill-box; transform-origin: center; animation: propSide .5s linear infinite; }
    @keyframes propSide { 0%{transform:scaleY(1)} 50%{transform:scaleY(0.15)} 100%{transform:scaleY(1)} }
    .missile { transform-box: fill-box; animation: launch 6s ease-in infinite; animation-delay: -3.7s; }
    @keyframes launch {
      0%, 52% { transform: translateY(4px); opacity: 0; }
      56% { transform: translateY(-2px); opacity: 1; }
      92% { transform: translateY(-88px); opacity: 1; }
      100% { transform: translateY(-102px); opacity: 0; }
    }
    .mflame { transform-box: fill-box; transform-origin: center top; animation: mflick .12s ease-in-out infinite alternate; }
    @keyframes mflick { from { transform: scaleY(1); } to { transform: scaleY(1.45); } }
    .smoke { transform-box: fill-box; animation: smoke 1.9s ease-out infinite; }
    @keyframes smoke { 0%{transform:translateY(0) scale(.6); opacity:.55} 100%{transform:translateY(-26px) scale(1.5); opacity:0} }
    .pw { transform-box: fill-box; animation: propwash 1.7s linear infinite; }
    .pw.d2 { animation-delay: -.55s; } .pw.d3 { animation-delay: -1.15s; }
    @keyframes propwash {
      0% { transform: translate(0,0) scale(.5); opacity:.55; }
      100% { transform: translate(-40px,-12px) scale(1.4); opacity:0; }
    }
  </style>
