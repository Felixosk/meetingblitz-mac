<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 261 126">
  <style>
    .bob { transform-box: fill-box; transform-origin: 50% 50%; animation: bob 3.2s ease-in-out infinite alternate; animation-delay: -2s; }
    @keyframes bob { from { transform: translateY(-4px) rotate(-1.5deg); } to { transform: translateY(4px) rotate(1.5deg); } }
    .prop { transform-box: fill-box; transform-origin: center; animation: propSide .5s linear infinite; animation-delay: -.05s; }
    @keyframes propSide { 0% { transform: scaleY(1); } 50% { transform: scaleY(.15); } 100% { transform: scaleY(1); } }
    .pw { transform-box: fill-box; animation: propwash 1.7s linear infinite; }
    .pw.d2 { animation-delay: -1.25s; }
    @keyframes propwash { 0% { transform: translate(0,0) scale(.5); opacity: .55; } 100% { transform: translate(-40px,-12px) scale(1.4); opacity: 0; } }
    .arm { transform-box: fill-box; transform-origin: left center; animation: armMove 2.6s ease-in-out infinite alternate; animation-delay: -.9s; }
    @keyframes armMove { from { transform: rotate(-7deg); } to { transform: rotate(8deg); } }
    .light { animation: blink 1.1s ease-in-out infinite; animation-delay: -.5s; }
    @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="a6f-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#e8eef2"/>
      <stop offset=".7" stop-color="#c3cfd8"/><stop offset=".92" stop-color="#98a7b2"/>
      <stop offset="1" stop-color="#b3c0ca"/>
    </linearGradient>
    <filter id="a6f-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="a6f-noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .82  0 0 0 0 .85  0 0 0 0 .88  0 0 0 .16 0"/>
      <feComposite operator="in" in2="SourceAlpha"/>
    </filter>
    <clipPath id="a6f-clip">
      <path d="M52 62 Q58 34 116 32 L156 34 Q190 40 194 62 Q190 82 152 88 L108 88 Q58 86 52 62 Z"/>
    </clipPath>
  </defs>
  <g class="bob">
    <g class="pw"><circle cx="44" cy="60" r="3" fill="#bfe8f5" opacity=".4"/></g>
    <g class="pw d2"><circle cx="42" cy="66" r="2.4" fill="#bfe8f5" opacity=".4"/></g>
    <g class="prop"><ellipse cx="36" cy="60" rx="5" ry="12" fill="#7d8d99" opacity=".85"/></g>
    <path d="M40 52 L56 46 L56 72 L40 66 Z" fill="#9dabb5"/>
    <path d="M52 62 Q58 34 116 32 L156 34 Q190 40 194 62 Q190 82 152 88 L108 88 Q58 86 52 62 Z" fill="url(#a6f-hull)"/>
    <g clip-path="url(#a6f-clip)">
      <path d="M52 62 Q58 34 116 32 L156 34 Q190 40 194 62 Q190 82 152 88 L108 88 Q58 86 52 62 Z" fill="#fff" filter="url(#a6f-noise)" opacity=".4"/>
      <path d="M64 44 Q120 34 184 46" stroke="#ffffff" stroke-width="1.8" fill="none" opacity=".7"/>
    </g>
    <path d="M104 34 Q108 16 130 16 Q152 16 156 34 Z" fill="#d84315"/>
    <path d="M106 30 Q130 24 154 30 L154 34 L104 34 Z" fill="#9c300f" opacity=".6"/>
    <path d="M108 20 Q130 15 152 20" stroke="#f2865e" stroke-width="1.4" fill="none" opacity=".7"/>
    <rect x="122" y="21" width="13" height="5" rx="2.5" fill="#f5f5f5" opacity=".95"/>
    <circle class="light" cx="146" cy="20" r="2" fill="#ffe082"/>
    <circle cx="172" cy="54" r="5.5" fill="#1c2830" stroke="#98a5af" stroke-width="2"/>
    <circle cx="182" cy="64" r="4.5" fill="#1c2830" stroke="#98a5af" stroke-width="2"/>
    <path d="M168 50 Q171 48 174 50" stroke="#9fc8da" stroke-width="1.4" fill="none" opacity=".8"/>
    <rect x="172" y="40" width="11" height="7" rx="2" fill="#8d9aa4"/>
    <circle cx="177.5" cy="43.5" r="2.6" fill="#ffe9a8"/>
    <g class="arm">
      <path d="M160 76 L184 86" stroke="#8d9aa4" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M184 86 L198 83 M184 86 L195 93" stroke="#8d9aa4" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <path d="M124 76 L146 84" stroke="#aab6c0" stroke-width="4" stroke-linecap="round"/>
    <rect x="154" y="84" width="38" height="9" rx="2" fill="none" stroke="#9dabb5" stroke-width="2"/>
    <line x1="164" y1="84" x2="164" y2="93" stroke="#9dabb5" stroke-width="1.4"/>
    <line x1="174" y1="84" x2="174" y2="93" stroke="#9dabb5" stroke-width="1.4"/>
    <g clip-path="url(#a6f-clip)">
      <g stroke="#aab6c0" stroke-width=".9" fill="none" opacity=".7">
        <path d="M84 38 Q82 60 86 86"/><path d="M124 34 Q124 60 124 88"/><path d="M156 36 Q158 60 154 87"/>
      </g>
      <ellipse cx="120" cy="42" rx="58" ry="4" fill="#ffffff" opacity=".55" filter="url(#a6f-blur)"/>
      <ellipse cx="122" cy="82" rx="66" ry="5" fill="#101820" opacity=".35" filter="url(#a6f-blur)"/>
    </g>
  </g>
</svg>
