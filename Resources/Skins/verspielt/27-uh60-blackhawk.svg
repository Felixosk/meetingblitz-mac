<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 -4 266 106">
  <defs>
    <linearGradient id="v27body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5140"/><stop offset="1" stop-color="#2e3427"/>
    </linearGradient>
  </defs>
  <style>
    .bob { transform-box: fill-box; animation: bob 2.9s ease-in-out infinite alternate; animation-delay: -1.6s; }
    @keyframes bob { from { transform: translateY(-4px) rotate(-1.6deg);} to { transform: translateY(4px) rotate(1.6deg);} }
    .rotor { transform-box: fill-box; transform-origin: center; animation: rotorSpin .13s linear infinite alternate; animation-delay: -.04s; }
    @keyframes rotorSpin { from { transform: scaleX(1); opacity:.55; } to { transform: scaleX(.8); opacity:.28; } }
    .prop { transform-box: fill-box; transform-origin: center; animation: propSide .5s linear infinite; animation-delay: -.21s; }
    @keyframes propSide { 0%{transform:scaleY(1)} 50%{transform:scaleY(.15)} 100%{transform:scaleY(1)} }
  </style>
  <g class="bob">
    <g transform="rotate(-2 150 60)">
      <g class="rotor"><ellipse cx="150" cy="18" rx="118" ry="4" fill="#8a949d" opacity=".5"/></g>
