<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 -8 216 106">
  <defs>
    <linearGradient id="n20vG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d9e6f"/><stop offset="1" stop-color="#2c6647"/>
    </linearGradient>
  </defs>
  <style>
    .n20-bob { transform-box: fill-box; transform-origin: center; animation: n20bob 2.9s ease-in-out infinite alternate; animation-delay: -1.1s; }
    @keyframes n20bob { from{ transform: translateY(-3px) rotate(-1.2deg); } to{ transform: translateY(3px) rotate(1.2deg); } }
    .hump { transform-box: fill-box; animation: humpBob 1.9s ease-in-out infinite alternate; }
    .hump.d2 { animation-delay: -0.65s; }
    .hump.d3 { animation-delay: -1.3s; }
    @keyframes humpBob { from{transform:translateY(-4px)} to{transform:translateY(4px)} }
  </style>
