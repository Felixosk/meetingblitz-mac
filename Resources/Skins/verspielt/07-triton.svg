<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 241 126">
  <style>
    .bob { transform-box: fill-box; transform-origin: 50% 50%; animation: bob 2.8s ease-in-out infinite alternate; animation-delay: -.8s; }
    @keyframes bob { from { transform: translateY(-4px) rotate(-1.5deg); } to { transform: translateY(4px) rotate(1.5deg); } }
    .prop { transform-box: fill-box; transform-origin: center; animation: propSide .5s linear infinite; animation-delay: -.19s; }
    @keyframes propSide { 0% { transform: scaleY(1); } 50% { transform: scaleY(.15); } 100% { transform: scaleY(1); } }
  </style>
  <defs>
    <linearGradient id="t7v-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/><stop offset="1" stop-color="#b8c9d6"/>
    </linearGradient>
    <radialGradient id="t7v-acryl" cx=".38" cy=".35" r=".75">
      <stop offset="0" stop-color="#e6f7ff" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#9fd8f0" stop-opacity=".4"/>
      <stop offset="1" stop-color="#5aa7cc" stop-opacity=".3"/>
    </radialGradient>
    <clipPath id="t7v-clip">
      <path d="M30 62 Q40 42 84 40 L150 42 Q176 46 182 60 Q176 76 150 80 L60 82 Q36 78 30 62 Z"/>
    </clipPath>
  </defs>
  <g class="bob">
