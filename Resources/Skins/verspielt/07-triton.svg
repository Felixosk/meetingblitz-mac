    <rect x="110" y="76" width="52" height="12" rx="6" fill="#8fa5b5"/>
    <g class="prop"><ellipse cx="30" cy="60" rx="5" ry="11" fill="#6d8494"/></g>
    <circle cx="152" cy="52" r="27" fill="url(#t7v-acryl)" stroke="#e6f4fb" stroke-width="2.5"/>
    <path d="M133 38 Q145 28 160 32" stroke="#ffffff" stroke-width="3" fill="none" opacity=".8" stroke-linecap="round"/>
    <circle cx="145" cy="52" r="4.5" fill="#37474f"/>
    <rect x="141" y="56" width="9" height="10" rx="3" fill="#546e7a"/>
    <circle cx="160" cy="54" r="4.5" fill="#795548"/>
    <rect x="156" y="58" width="9" height="9" rx="3" fill="#8d6e63"/>
