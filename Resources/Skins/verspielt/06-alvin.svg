<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 251 126">
  <style>
    .bob { transform-box: fill-box; transform-origin: 50% 50%; animation: bob 3s ease-in-out infinite alternate; animation-delay: -1.1s; }
    @keyframes bob { from { transform: translateY(-4px) rotate(-1.5deg); } to { transform: translateY(4px) rotate(1.5deg); } }
    .prop { transform-box: fill-box; transform-origin: center; animation: propSide .5s linear infinite; animation-delay: -.4s; }
    @keyframes propSide { 0% { transform: scaleY(1); } 50% { transform: scaleY(.15); } 100% { transform: scaleY(1); } }
    .arm { transform-box: fill-box; transform-origin: left center; animation: armMove 2.6s ease-in-out infinite alternate; animation-delay: -1.7s; }
    @keyframes armMove { from { transform: rotate(-7deg); } to { transform: rotate(8deg); } }
  </style>
  <defs>
    <linearGradient id="a6v-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d4dc"/>
    </linearGradient>
    <clipPath id="a6v-clip">
      <ellipse cx="118" cy="56" rx="68" ry="26"/>
    </clipPath>
  </defs>
  <g class="bob">
    <g class="prop"><ellipse cx="30" cy="56" rx="6" ry="13" fill="#8898a5"/></g>
    <path d="M34 48 L50 40 L50 68 L34 62 Z" fill="#aab8c2"/>
    <ellipse cx="118" cy="56" rx="68" ry="26" fill="url(#a6v-hull)" stroke="#8898a5" stroke-width="2"/>
    <path d="M96 30 Q100 12 122 12 Q144 12 148 30 Z" fill="#e8542f" stroke="#a83a1e" stroke-width="2"/>
    <rect x="114" y="16" width="14" height="6" rx="3" fill="#ffffff" opacity=".85"/>
    <circle cx="164" cy="50" r="6" fill="#37474f" stroke="#8898a5" stroke-width="2"/>
    <circle cx="176" cy="60" r="5" fill="#37474f" stroke="#8898a5" stroke-width="2"/>
    <circle cx="183" cy="47" r="4.5" fill="#ffe082" stroke="#8898a5" stroke-width="1.5"/>
    <text x="72" y="52" fill="#37474f" font-size="11" font-weight="bold" font-family="-apple-system, sans-serif">ALVIN</text>
    <g clip-path="url(#a6v-clip)">
      <line x1="58" y1="62" x2="96" y2="62" stroke="#e8542f" stroke-width="4" stroke-linecap="round" opacity=".85"/>
      <ellipse cx="112" cy="42" rx="46" ry="6" fill="#ffffff" opacity=".4"/>
    </g>
    <g class="arm">
      <path d="M150 72 L176 84" stroke="#78909c" stroke-width="5" stroke-linecap="round"/>
      <path d="M176 84 L192 80 M176 84 L190 92" stroke="#78909c" stroke-width="4" stroke-linecap="round"/>
    </g>
    <rect x="98" y="80" width="44" height="8" rx="3" fill="#aab8c2" stroke="#8898a5" stroke-width="1.5"/>
  </g>
</svg>
