<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 300 96">
  <defs>
    <linearGradient id="f21vG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a636e"/><stop offset="1" stop-color="#3e454e"/>
    </linearGradient>
    <clipPath id="f21vHull">
      <path d="M36 50 Q60 32 110 28 Q180 22 236 28 Q272 34 282 48 Q276 60 244 66 Q180 74 110 70 Q60 66 36 50 Z"/>
    </clipPath>
  </defs>
  <style>
    .f21-bob { transform-box: fill-box; transform-origin: center; animation: f21bob 3s ease-in-out infinite alternate; animation-delay: -1.4s; }
    @keyframes f21bob { from{ transform: translateY(-3px) rotate(-1.3deg); } to{ transform: translateY(3px) rotate(1.3deg); } }
    .spout { transform-box: fill-box; transform-origin: bottom center; animation: spout 4.2s ease-in-out infinite; animation-delay: -1.8s; }
    @keyframes spout {
      0%, 52% { transform: scaleY(0); opacity: 0; }
      62% { transform: scaleY(1); opacity: .95; }
      82% { transform: scaleY(1.06); opacity: .55; }
      100% { transform: scaleY(.2); opacity: 0; }
    }
    .tail { transform-box: fill-box; transform-origin: right center; animation: flap 0.9s ease-in-out infinite alternate; animation-delay: -.4s; }
    @keyframes flap { from{transform:rotate(-9deg)} to{transform:rotate(9deg)} }
  </style>
  <g class="f21-bob">
    <g class="spout">
      <path d="M252 20 L252 0" stroke="#bfe8f5" stroke-width="4" stroke-linecap="round"/>
      <path d="M249 22 Q248 8 244 4" stroke="#bfe8f5" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M255 22 Q256 8 260 4" stroke="#bfe8f5" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
    <g class="tail"><path d="M8 28 Q22 42 40 50 Q24 58 8 76 Q18 56 12 52 Q18 44 8 28 Z" fill="#3e454e"/></g>
    <path d="M92 30 Q100 16 110 16 Q102 24 104 30 Z" fill="#3e454e"/>
    <path d="M36 50 Q60 32 110 28 Q180 22 236 28 Q272 34 282 48 Q276 60 244 66 Q180 74 110 70 Q60 66 36 50 Z"
          fill="url(#f21vG)" stroke="#2b3138" stroke-width="2"/>
    <path d="M196 30 Q214 40 236 32 Q220 46 198 44 Q206 36 196 30 Z" fill="#9aa5ae" opacity=".55"/>
    <path d="M280 50 Q262 62 236 64 Q256 54 268 46 Z" fill="#e8edf1" opacity=".9"/>
    <g stroke="#2b3138" stroke-width="1.3" fill="none" opacity=".6">
      <path d="M232 64 Q250 58 272 50"/><path d="M226 60 Q248 54 268 46"/><path d="M222 56 Q244 50 264 42"/>
    </g>
    <circle cx="252" cy="42" r="3" fill="#10151a"/>
    <path d="M212 60 Q222 70 218 80 Q204 74 202 62 Z" fill="#333a42"/>
    <g clip-path="url(#f21vHull)">
      <ellipse cx="150" cy="34" rx="80" ry="5" fill="#ffffff" opacity=".1"/>
    </g>
  </g>
</svg>
