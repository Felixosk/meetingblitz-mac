name: Build

# Proves the one thing that actually breaks for other people: that a clean
# checkout builds on a Mac that has neither the author's signing certificate
# nor a `signing.local` file. build.sh falls back to ad-hoc signing in that
# case, and this job is the only place that path is ever exercised.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        # Pick the newest Xcode present on the runner rather than its default.
        # This matters: the app is written against Swift 6.2, and Swift 6.1
        # (Xcode 16.4, the macos-15 default) rejects several AppKit globals as
        # non-Sendable. Building on the older compiler tests a toolchain nobody
        # actually ships with, and turns the job into a permanent red cross.
        # The version is printed so a failure here is never a mystery.
        run: |
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            echo "selecting $latest"
            sudo xcode-select -s "$latest"
          fi
          swift --version
          xcodebuild -version || true

      - name: Build (universal, ad-hoc signed, runs the self-test)
        # build.sh compiles both architectures, assembles the bundle, signs it
        # and finishes with `MeetingBlitz --selftest`, which fails the build if
        # link detection or free-text parsing regress. The timeout keeps a stuck
        # launch from burning the full job budget: the self-test starts the app,
        # so it needs a working app environment, and a hang here is a real
        # finding rather than something to wait out.
        #
        # Use the runner's own timeout-minutes, NOT the `timeout` command:
        # that is GNU coreutils and does not exist on a macOS runner
        # ("timeout: command not found", exit 127, first attempt died on it).
        timeout-minutes: 15
        run: ./build.sh

      - name: Both architectures present
        # Intel support is not theoretical: a lipo step that silently drops an
        # arch would only surface on someone else's older Mac.
        run: |
          archs="$(lipo -archs dist/MeetingBlitz.app/Contents/MacOS/MeetingBlitz)"
          echo "archs: $archs"
          case "$archs" in
            *arm64*) ;;
            *) echo "::error::arm64 missing"; exit 1 ;;
          esac
          case "$archs" in
            *x86_64*) ;;
            *) echo "::error::x86_64 missing"; exit 1 ;;
          esac

      - name: Bundle is signed and well-formed
        run: codesign --verify --strict --verbose=2 dist/MeetingBlitz.app
